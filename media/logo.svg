<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="0.6" stop-color="#16132e"/>
      <stop offset="1" stop-color="#0b0a18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.45" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b9781d"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f8f"/>
      <stop offset="1" stop-color="#173a5c"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset="1" stop-color="#4fb6e8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <!-- faint rays -->
  <g opacity="0.10" stroke="#f2c14e" stroke-width="3">
    <line x1="256" y1="236" x2="256" y2="20"/>
    <line x1="256" y1="236" x2="70" y2="70"/>
    <line x1="256" y1="236" x2="442" y2="70"/>
    <line x1="256" y1="236" x2="20" y2="236"/>
    <line x1="256" y1="236" x2="492" y2="236"/>
  </g>

  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M256 70 L402 116 C402 262 352 370 256 436 C160 370 110 262 110 116 Z"
          fill="url(#gold)"/>
    <path d="M256 92 L382 131 C382 255 338 352 256 410 C174 352 130 255 130 131 Z"
          fill="url(#shield)"/>
    <!-- inner bevel line -->
    <path d="M256 108 L366 142 C366 250 327 338 256 390 C185 338 146 250 146 142 Z"
          fill="none" stroke="#7fd0f0" stroke-opacity="0.25" stroke-width="3"/>
  </g>

  <!-- infinity loop (Forever) -->
  <g filter="url(#glow)" transform="translate(0,26)">
    <path d="M256 262
             C232 228 188 214 166 240
             C146 264 162 300 196 300
             C222 300 240 280 256 262
             C272 244 290 224 316 224
             C350 224 366 260 346 284
             C324 310 280 296 256 262 Z"
          fill="none" stroke="url(#loop)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- star (best in slot) -->
  <g filter="url(#glow)">
    <path d="M256 132 L270 178 L316 192 L270 206 L256 252 L242 206 L196 192 L242 178 Z"
          fill="url(#gold)"/>
  </g>

</svg>
